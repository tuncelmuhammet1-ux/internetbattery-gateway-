name: Android 0.17 VPN HTTPS over temporary protected WSS
on:
  push:
    branches: [test/android017-vpn-e2e]
  workflow_dispatch:

concurrency:
  group: ib-android017-vpn-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-wss:
    runs-on: ubuntu-latest
    timeout-minutes: 38
    steps:
      - name: Checkout isolated laboratory verification
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install Java 17
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Prepare SHA-pinned Android sources and ephemeral protected WSS relay
        run: bash .github/scripts/android017-wss-setup.sh
      - name: Restore hash-verified original Android native runtime
        working-directory: android-src/InternetBattery_0_13
        run: python3 scripts/fetch_hev_aar.py
      - name: Build Android 0.17 application and WSS instrumented tests
        working-directory: android-src/InternetBattery_0_13
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Enable Android emulator KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm
      - name: Boot Android 15 and verify WSS preflight followed by user-consented VPN/TUN HTTPS
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/android017-wss-emulator.sh && bash .github/scripts/android017-vpn-emulator.sh
      - name: Save non-secret integration test result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: internetbattery-017-android-vpn-e2e-proof
          path: |
            .private/ci-instrumentation-result.txt
            .private/ci-vpn-instrumentation-result.txt
          if-no-files-found: warn
          retention-days: 7
      - name: Terminate temporary WSS gateway and tunnel
        if: always()
        run: |
          for file in .private/cloudflared.pid .private/gateway.pid; do
            if test -f "$file"; then kill "$(cat "$file")" 2>/dev/null || true; fi
          done
