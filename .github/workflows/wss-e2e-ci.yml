name: Real TCP and TLS/HTTPS through WSS laboratory gate
on:
  push:
    branches: [feature/real-wss-tls-smoke]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  unit-and-real-https:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Run pure local regression suite
        run: npm test
      - name: Verify genuine public HTTPS over locally authenticated WSS gateway
        run: node tools/remote-https-ci.mjs
