name: Bootstrap locked pg dependency for IB15
on:
  push:
    branches:
      - feature/ib-wallet-postgres
permissions:
  contents: write
jobs:
  create-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Generate package-lock.json without executing install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile if necessary
        run: |
          git config user.name 'internetbattery-ci'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- package-lock.json; then
            git add package-lock.json
            git commit -m 'chore: lock verified pg dependency for Postgres lab'
            git push origin HEAD:refs/heads/feature/ib-wallet-postgres
          fi
