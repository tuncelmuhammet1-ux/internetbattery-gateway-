name: IB Android 0.17 emulator install and launch
on:
  push:
    branches: [test/android017-emulator]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-boot-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout verification workflow
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Fetch pinned 0.17 research APK
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 --max-time 120 \
            'https://github.com/tuncelmuhammet1-ux/internetbattery-gateway-/releases/download/android-0.17.0-lab/InternetBattery-0.17.0-lab-debug.apk' \
            --output internetbattery-0.17-lab.apk
          printf '%s  %s\n' 'b57e09551d1f5471a37a224601f2465c8c3116f20703a59fa4557ed0036ee12d' 'internetbattery-0.17-lab.apk' | sha256sum --check -
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Boot real Android 15 emulator and exercise app launch
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash .github/scripts/android017-emulator-smoke.sh
      - name: Upload non-secret launch logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: internetbattery-017-emulator-logs
          path: |
            /tmp/ib_android_pkg.txt
            /tmp/ib_android_launch.txt
            /tmp/ib_android_logcat.txt
          if-no-files-found: warn
          retention-days: 7
