name: IB15 Wallet Security and PostgreSQL Atomicity
on:
  push:
    branches:
      - feature/ib-wallet-postgres
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iblab
          POSTGRES_PASSWORD: local_test_password_only
          POSTGRES_DB: iblab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iblab -d iblab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://iblab:local_test_password_only@localhost:5432/iblab
    steps:
      - name: Checkout reviewed sources
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Syntax checks
        run: |
          node --check server.mjs
          node --check wallet-api.mjs
          node --check ledger.mjs
          node --check voucher.mjs
          node --check android013.mjs
      - name: Test including real Postgres
        run: npm test
